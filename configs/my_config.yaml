
# ------ Output and Logging ------
# Root directory for saving all outputs (logs, checkpoints, visualizations)
# If not specified or empty, defaults to './my_caches'
# Can also be set via command line: --cache_root /path/to/outputs
cache_root: './my_caches'
save_vis_interval: 5  # Save attention maps every N epochs

# ------ root_path ------
root_path: "/data/xinhua/Datasets"
ood_dataset_path: "/data/xinhua/Datasets/ood-benchmark/imagenet"
clip_model_path: "data/xinhua/.cache/clip/"

# ------ id dataset------

# id_dataset: 'imagenet100'
# id_dataset: 'dtd' 
# id_dataset: 'food101'  
# id_dataset: 'stanford_cars' 
# id_dataset: 'caltech101' 
# id_dataset: 'oxford_flowers'
# id_dataset: 'oxford_pets'

id_dataset: 'imagenet'  
# id_dataset: 'eurosat'
# id_dataset: 'fgvc'
# id_dataset: 'ucf101'

#------ ood_dataset ------
# ood_dataset: 'SUN'
# ood_dataset: 'iNaturalist'
# ood_dataset: 'Places'
# ood_dataset: 'dtd'
# ood_dataset: 'OpenImage_O'
# ood_dataset: 'NINCO'
# ood_dataset: 'Imagenet-o'
# ood_dataset: 'ssb_hard'

ood_dataset: 'common'
# ood_dataset: 'challenging'
# ood_dataset: 'nearood'
# ood_dataset: 'all'



# ------ Hyperparamters ------
seed: 1

shots: 16
backbone: 'ViT-B/16'
K: 3
csc: False
template: 'a photo of a'

# Templates for version 2 (SimpleCLIP) - use this instead of PromptLearner
templates: ['a photo of a']
# Can use multiple templates:
# templates: ['a photo of a', 'a picture of a', 'an image of a']

lr: 0.002 # 0.0002  0.02 0.002
fine_tune_train_epoch: 50  # 200 30
fine_tune_batch_size: 160  # 160 100

test_batch_size: 250

# --- Gating / RL hyperparameters ---
# Use reinforcement learning for discrete gating (True) or soft sigmoid gating (False)
use_rl: False
# L1 sparsity weight (for soft mode) and sparsity penalty used in RL reward
lambda_sparsity: 0.001
# Minimal-set / negative suppression weight (used in soft mode and as lambda_min in RL reward)
lambda_minimal: 0.01
# Learning rate for gate network (if training separately)
lr_gate: 0.0002
# Gate network hidden dimension
gate_hidden: 256

# ------ Modular Model Configuration ------
# Feature selector type: 'mlp' or 'slot'
selector_type: 'slot'
num_select: 49
num_slots: 4
num_heads_selector: 4

# Feature fuser type: 'mean', 'query_attn', or 'self_attn'
fuser_type: 'query_attn'
num_heads_fuser: 4

# Loss weights
lambda_diversity: 0.01
lambda_orthogonality: 0.01
lambda_semantic_exclusion: 0.01
lambda_llm_negatives: 0.05
lambda_mixup: 0.1

# Feature flags
use_semantic_exclusion: False
use_llm_negatives: True
use_mixup_invariance: True

# LLM Negatives path (by default look under `my_dataset` where you will place it)
class_negatives_path: 'my_dataset/class_negatives.json'
